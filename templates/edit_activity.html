{% extends "base.html" %}
{% block title %}Edit Activity{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">✏️ Edit Activity</h2>

  <form method="POST" enctype="multipart/form-data">
    <div class="row">
      <div class="col-md-6 mb-3">
        <input type="text" name="title_en" class="form-control" placeholder="Title (EN)" value="{{ activity.title_en }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <input type="text" name="title_ar" class="form-control" placeholder="العنوان (AR)" value="{{ activity.title_ar }}" required>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <textarea name="description_en" class="form-control" placeholder="Description (EN)" required>{{ activity.description_en }}</textarea>
      </div>
      <div class="col-md-6 mb-3">
        <textarea name="description_ar" class="form-control" placeholder="الوصف (AR)" required>{{ activity.description_ar }}</textarea>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <input type="text" name="title_ku" class="form-control" placeholder="Title (KU)" value="{{ activity.title_ku }}">
      </div>
      <div class="col-md-6 mb-3">
        <input type="text" name="title_de" class="form-control" placeholder="Title (DE)" value="{{ activity.title_de }}">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <textarea name="description_ku" class="form-control" placeholder="Description (KU)">{{ activity.description_ku }}</textarea>
      </div>
      <div class="col-md-6 mb-3">
        <textarea name="description_de" class="form-control" placeholder="Description (DE)">{{ activity.description_de }}</textarea>
      </div>
    </div>

    <div class="col-md-12 mb-3">
      <select class="form-control" name="category" required>
        <option value="">-- Category --</option>
        <option value="education" {% if activity.category=='education' %}selected{% endif %}>Education</option>
        <option value="sports" {% if activity.category=='sports' %}selected{% endif %}>Sports</option>
        <option value="arts" {% if activity.category=='arts' %}selected{% endif %}>Arts</option>
        <option value="cultural" {% if activity.category=='cultural' %}selected{% endif %}>Cultural</option>
        <option value="other" {% if activity.category=='other' %}selected{% endif %}>Other</option>
      </select>
    </div>

    <div class="col-md-12 mb-3">
      <input type="file" name="images" class="form-control" multiple>
      {% if activity.images %}
        <small class="text-muted">Current images: {{ activity.images }}</small>
      {% endif %}
    </div>

    <button class="btn btn-primary">Update Activity</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
